<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Variant A — Case Board · Red Strings</title>
<script>
/* Dev probe: collects script errors, unhandled rejections and failed
   resource loads (fonts, portraits) so a headless pass can read them. */
window.__errs = [];
window.addEventListener("error", function (e) {
  var t = e.target;
  if (t && t !== window && (t.tagName === "IMG" || t.tagName === "SCRIPT" || t.tagName === "LINK")) {
    window.__errs.push("resource " + t.tagName + " " + (t.currentSrc || t.src || t.href));
  } else {
    window.__errs.push("error " + (e.message || "") + " @" + (e.filename || "") + ":" + (e.lineno || 0));
  }
}, true);
window.addEventListener("unhandledrejection", function (e) {
  window.__errs.push("rejection " + String((e.reason && e.reason.stack) || e.reason));
});
/* console.error/warn too: a theme callback that throws inside the frame loop
   is caught by the engine and reported through console.error, which never
   reaches window.onerror. Without this the page looks blank and silent. */
["error", "warn"].forEach(function (k) {
  var orig = console[k];
  console[k] = function () {
    window.__errs.push(k + ": " + Array.prototype.map.call(arguments, function (a) {
      return (a && a.stack) || String(a);
    }).join(" "));
    return orig.apply(console, arguments);
  };
});
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="lib/base.css" />
<style>
/* ══ VARIANT A — CASE BOARD ══════════════════════════════════════════
   A detective's evidence board in a dark room. Cork, steel pins, manila
   photo mounts and crimson thread, lit by one tungsten bulb off to the
   upper left. Everything outside that pool falls to near-black.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --manila:#E8DCC8; --manila-hi:#F2E9D8; --manila-lo:#D6C6A8; --manila-edge:#C2AE8A;
  --ink:#1A1410; --ink-dim:#6B5B45; --thread:#C8102E; --brass:#C9A24A;
}
body{ background:#0A0806; font-family:'Inter',system-ui,sans-serif; color:#D9CBAC; }

/* ── material: cork over plaster, one pool of tungsten light ─────── */
.bg{
  background-color:#2E2418;
  background-image:
    radial-gradient(52% 44% at 27% 20%, rgba(255,230,182,.2), rgba(255,230,182,0) 70%),
    radial-gradient(34% 30% at 84% 88%, rgba(255,208,152,.075), rgba(255,208,152,0) 72%),
    radial-gradient(22% 20% at 12% 74%, rgba(96,72,44,.4), rgba(96,72,44,0) 72%),
    radial-gradient(26% 22% at 68% 16%, rgba(88,64,38,.36), rgba(88,64,38,0) 74%),
    linear-gradient(158deg,#43341F 0%,#332719 44%,#261D12 100%);
}
/* world-anchored grain: the board moves under a fixed light */
.tile{
  background-image:var(--noise);
  background-repeat:repeat;
  opacity:.9;
}
.tile>i{
  position:absolute; inset:0;
  background-image:
    radial-gradient(circle at 30% 32%, rgba(255,238,206,.055) 0 1px, transparent 1.7px),
    radial-gradient(circle at 72% 64%, rgba(0,0,0,.22) 0 1.5px, transparent 2.2px),
    radial-gradient(circle at 50% 50%, rgba(255,232,190,.03) 0 .8px, transparent 1.2px);
  background-size:6px 6px,9px 9px,3px 3px;
}
/* the room: vignette down to black + a faint lens haze */
/* The bulb is up and to the left; a second, much weaker bounce comes back off
   the floor at the lower right so the police cluster at the bottom of the
   board is dim rather than unreadable. */
.veil{
  background:
    radial-gradient(72% 62% at 30% 24%, rgba(255,226,180,.055), rgba(0,0,0,0) 62%),
    radial-gradient(40% 34% at 84% 96%, rgba(255,196,132,.045), rgba(0,0,0,0) 70%),
    radial-gradient(128% 118% at 42% 46%, rgba(0,0,0,0) 46%, rgba(0,0,0,.42) 80%, rgba(0,0,0,.7) 100%);
}

/* ── title: a taped index card ───────────────────────────────────── */
.slot-title{ left:24px; top:22px; }
.brand__card{
  position:relative; max-width:284px; padding:15px 19px 13px;
  background:linear-gradient(158deg,#F4EBD9,#DCCDB0);
  color:var(--ink); border-radius:2px; transform:rotate(-1.4deg);
  box-shadow:0 18px 34px -12px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.5) inset;
}
.brand__card::before{
  content:''; position:absolute; top:-12px; left:30px; width:104px; height:25px;
  background:linear-gradient(180deg,rgba(230,218,186,.85),rgba(203,188,152,.8));
  transform:rotate(-3.2deg); box-shadow:0 4px 9px rgba(0,0,0,.45);
  border-left:1px solid rgba(255,255,255,.4); border-right:1px solid rgba(122,104,74,.35);
}
.brand__case{ display:block; font-family:'Courier Prime',monospace; font-size:10px; letter-spacing:.17em; text-transform:uppercase; color:#8A6A3A; }
.brand__title{ margin:3px 0 5px; font-family:'Oswald',sans-serif; font-weight:700; font-size:28px; line-height:.98; letter-spacing:.005em; text-transform:uppercase; }
.brand__sub{ margin:0; font-family:'Courier Prime',monospace; font-size:10px; letter-spacing:.05em; color:var(--ink-dim); }

/* ── legend: the thread spool tray, a manila card pinned to the board ──
   Deliberately the SAME stock as the photo mounts, so the tray reads as one
   more artefact on the board rather than a UI panel floating over it. It also
   has to be light: the adversary thread is black cord, and a black swatch on a
   dark panel is an empty row. */
.slot-legend{ right:24px; top:22px; width:250px; display:flex; justify-content:flex-end; }
.legend-wrap{ position:relative; width:100%; }
.legend-wrap .legend{ display:none; }
.legend-wrap.is-open .legend{ display:block; }
.legend-wrap.is-open .legend__tab{ display:none; }
/* the collapsed spool tab — same manila stock, so it is the tray seen edge-on */
.legend__tab{
  display:flex; align-items:center; gap:9px; width:100%;
  padding:9px 11px; border-radius:2px; cursor:pointer;
  background:linear-gradient(158deg,#F0E6D2,#DCCDB2);
  border:1px solid rgba(120,98,66,.55); color:#231A10;
  box-shadow:0 18px 34px -14px rgba(0,0,0,.9);
}
.legend__tab:hover{ background:linear-gradient(158deg,#F6EEDC,#E2D4BB); }
.legend__tab-label{
  font-family:'Oswald',sans-serif; font-weight:700; font-size:11px;
  letter-spacing:.16em; text-transform:uppercase; white-space:nowrap;
}
.legend__tab-dots{ display:flex; gap:3px; margin-left:auto; }
.legend__tab-dots i{ width:7px; height:7px; border-radius:50%; box-shadow:0 1px 1px rgba(0,0,0,.35); }
.legend__tab-hint{
  font-family:'Courier Prime',monospace; font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; color:#7A6746; white-space:nowrap;
}
.legend{
  position:relative; padding:12px 12px 10px; border-radius:2px;
  background:
    linear-gradient(158deg, #F0E6D2 0%, #E6D9C1 46%, #DCCDB2 100%);
  border:1px solid rgba(120,98,66,.55);
  box-shadow:
    0 24px 46px -16px rgba(0,0,0,.95),
    0 2px 0 rgba(255,255,255,.12) inset,
    0 -18px 30px -22px rgba(120,92,56,.9) inset;
}
/* punched hole + pin, top centre — it is a card, so it hangs like one */
.legend::before{
  content:''; position:absolute; left:50%; top:7px; width:7px; height:7px;
  margin-left:-3.5px; border-radius:50%;
  background:radial-gradient(circle at 36% 30%, #C9A24A, #7A5F22 62%, #3A2C10);
  box-shadow:0 2px 4px rgba(0,0,0,.55), 0 0 0 1px rgba(60,44,16,.6);
}
.legend__head{ display:flex; flex-direction:column; gap:1px; margin:6px 2px 8px; }
.legend__head span{ font-family:'Oswald',sans-serif; font-weight:700; font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:#231A10; }
.legend__head em{ font-family:'Courier Prime',monospace; font-style:normal; font-size:9.5px; letter-spacing:.02em; color:#7A6746; }
.legend__item{ border-radius:1px; color:#2C2317; font-size:11.5px; font-weight:500; gap:8px; padding:.32rem .3rem; }
.legend__item:hover{ background:rgba(60,42,18,.09); }
.legend__item.is-active{ background:rgba(200,16,46,.13); box-shadow:inset 0 0 0 1px rgba(176,20,42,.45); }
.legend__swatch svg{ display:block; }
.legend__count{ font-family:'Courier Prime',monospace; font-size:10.5px; color:#7A6746; opacity:1; }
.legend__clear{
  font-family:'Courier Prime',monospace; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:#A8121F; border-top:1px dashed rgba(122,103,70,.5); margin-top:7px; padding-top:8px;
}

/* ── search: a magnifier on a manila slip ────────────────────────── */
.slot-search{ left:24px; bottom:26px; width:296px; }
.search__head{ font-family:'Oswald',sans-serif; font-weight:600; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#B7A483; margin:0 0 6px 3px; }
.search{
  display:flex; align-items:center; gap:8px; padding:8px 11px; border-radius:2px;
  background:linear-gradient(180deg,#F4EBD9,#E1D2B4); transform:rotate(-.5deg);
  box-shadow:0 16px 30px -12px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.5) inset;
}
.search::before{
  content:''; flex:none; width:13px; height:13px; border-radius:50%;
  border:2px solid #7A6242; box-shadow:5px 5px 0 -3.5px #7A6242;
}
.search__input{ font-family:'Courier Prime',monospace; font-size:12.5px; color:var(--ink); }
.search__input::placeholder{ color:#9C8767; }
.search__results{ margin-top:7px; border-radius:2px; overflow:hidden; background:rgba(18,14,10,.95); border:1px solid rgba(148,122,84,.28); box-shadow:0 18px 34px -14px rgba(0,0,0,.9); }
.search__hit{ color:#D6C8A9; font-size:11.5px; }
.search__hit:hover{ background:rgba(255,226,178,.08); }
.search__role{ font-family:'Courier Prime',monospace; font-size:9.5px; }
.search__none{ padding:.5rem .6rem; font-family:'Courier Prime',monospace; font-size:10.5px; color:#8B795B; }

/* ── tools: brass fittings ───────────────────────────────────────── */
.slot-tools{ right:24px; bottom:26px; }
.tools__btn{
  width:32px; height:32px; border-radius:50%; color:#2A1E0C; font-weight:700; font-size:15px;
  background:radial-gradient(circle at 34% 26%, #EFD79A, #B48C42 58%, #6E5322);
  border:1px solid rgba(255,236,190,.32);
  box-shadow:0 4px 10px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform 120ms cubic-bezier(.2,.8,.2,1), filter 120ms;
}
.tools__btn:hover{ filter:brightness(1.12); transform:translateY(-1px); }
.tools__btn:active{ transform:translateY(0); filter:brightness(.94); }
.tools__btn--wide{ width:auto; padding:0 13px; border-radius:16px; font-family:'Oswald',sans-serif; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; }
.tools__k{ font-family:'Courier Prime',monospace; font-size:11px; color:#C4B08A; }

/* ── hud ─────────────────────────────────────────────────────────── */
.slot-hud{ left:50%; bottom:28px; transform:translateX(-50%); }
.hud{ font-family:'Courier Prime',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#8B795B; gap:14px; }
.hud b{ color:#C4B08A; font-weight:700; }

/* ── dossier: the case file sheet ────────────────────────────────── */
.dossier{ right:24px; top:96px; bottom:24px; width:392px; transform:translateX(26px) rotate(.6deg); }
.dossier.is-open{ transform:translateX(0) rotate(0deg); }
.file{
  position:relative; display:flex; flex-direction:column; height:100%; overflow:hidden;
  padding:22px 22px 0; border-radius:3px; color:var(--ink);
  background:linear-gradient(168deg,#F4EBD9 0%,#E6D7BA 58%,#DCCBA8 100%);
  box-shadow:0 34px 64px -22px rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.55) inset;
}
.file::before{
  content:''; position:absolute; left:0; right:0; top:0; height:5px;
  background:repeating-linear-gradient(90deg,#C8102E 0 14px,#E8DCC8 14px 28px);
  opacity:.75;
}
.dossier__close{ position:absolute; right:14px; top:16px; width:26px; height:26px; font-size:13px; color:#7A6242; border-radius:50%; }
.dossier__close:hover{ background:rgba(122,98,66,.14); }
.file__stamp{
  display:inline-block; margin-bottom:9px; padding:3px 9px; border-radius:1px;
  font-family:'Oswald',sans-serif; font-weight:600; font-size:10px; letter-spacing:.17em; text-transform:uppercase;
  color:#8E1B2C; border:1.5px solid rgba(142,27,44,.55); transform:rotate(-1.6deg);
}
.file__name{ margin:0 0 4px; font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; line-height:1.02; letter-spacing:.005em; text-transform:uppercase; }
.file__alias{ margin:0 0 6px; font-family:'Courier Prime',monospace; font-size:11px; color:#8A6A3A; letter-spacing:.03em; }
.file__role{ margin:0; font-size:12.5px; line-height:1.5; color:#4A3E2E; }
.file__bio{ margin:14px 0 0; font-size:13.5px; line-height:1.68; color:#2E2519; }
.file__rule{ display:flex; align-items:center; gap:10px; margin:18px 0 4px; font-family:'Courier Prime',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#7A6242; }
.file__rule::after{ content:''; flex:1; height:1px; background:rgba(122,98,66,.35); }
.file__threads{ list-style:none; margin:0; padding:0 0 22px; overflow-y:auto; overscroll-behavior:contain; flex:1; }
.file__threads::-webkit-scrollbar{ width:6px; }
.file__threads::-webkit-scrollbar-thumb{ background:rgba(122,98,66,.35); border-radius:3px; }
.thread{ display:flex; gap:10px; width:100%; padding:9px 6px; border:0; border-bottom:1px dashed rgba(122,98,66,.28); background:none; color:inherit; font:inherit; text-align:left; cursor:pointer; border-radius:2px; }
.thread:hover{ background:rgba(122,98,66,.1); }
.thread__swatch{ flex:none; padding-top:3px; }
.thread__body{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.thread__type{ font-family:'Oswald',sans-serif; font-weight:600; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:#8A6A3A; }
.thread__name{ font-size:12.5px; font-weight:600; }
.thread__detail{ font-size:11.5px; line-height:1.5; color:#5A4C38; }

@media (max-width:900px){
  .slot-legend{ display:none; }
  .slot-hud{ display:none; }
  .dossier{ left:12px; right:12px; top:auto; bottom:12px; width:auto; height:66vh; transform:translateY(26px); }
  .dossier.is-open{ transform:translateY(0); }
  .slot-search{ left:14px; right:14px; bottom:16px; width:auto; }
  .brand__card{ max-width:210px; padding:11px 14px 10px; }
  .brand__title{ font-size:21px; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" aria-hidden="true"></div>
  <div class="tile" id="tile" aria-hidden="true"><i></i></div>
  <canvas class="canvas" id="canvas" aria-label="Detective Conan relationship graph — case board"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <div class="chrome">
    <div class="slot-title" id="slot-title"></div>
    <div class="slot-legend" id="slot-legend"></div>
    <div class="slot-search" id="slot-search"></div>
    <div class="slot-tools" id="slot-tools"></div>
    <div class="slot-hud" id="slot-hud"></div>
  </div>

  <aside class="dossier" id="dossier" aria-hidden="true" aria-label="Case file"></aside>
  <ul class="a11y" id="a11y" aria-label="Character list"></ul>
</div>

<script src="lib/data.js"></script>
<script src="lib/engine.js"></script>
<script src="lib/theme-a.js"></script>
<script>
(function () {
  window.__app = DCPHEngine.create({
    theme: window.DCPH_THEME_A,
    root: document.getElementById('stage'),
    canvas: document.getElementById('canvas'),
    bg: document.getElementById('tile'),
    dossier: document.getElementById('dossier'),
    a11y: document.getElementById('a11y'),
    slots: {
      title: document.getElementById('slot-title'),
      legend: document.getElementById('slot-legend'),
      tools: document.getElementById('slot-tools'),
      search: document.getElementById('slot-search'),
      hud: document.getElementById('slot-hud')
    }
  });
})();
</script>
</body>
</html>
